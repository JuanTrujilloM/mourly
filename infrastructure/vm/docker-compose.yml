# Production stack for the GCP VM. Only Caddy publishes ports; the API is reachable
# solely through it, which is what makes `trust proxy` (1 hop) in main.ts safe.

# json-file keeps logs forever by default; on a small disk that eventually stops Docker.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The VM has 1 GB of RAM and a deploy runs the old API, Caddy and migrate at once.
# The limits keep that sum (512 + 128 + 256 MB) under what the kernel can hand out.
services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Heap below mem_limit so Node collects garbage before the cgroup kills it.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    # Longer than the API's 15 s drain of pending verification emails; Docker's default is 10 s.
    stop_grace_period: 20s
    logging: *logging
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    mem_limit: 128m
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the TLS certificates; losing it forces a re-issue and can hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

  # One-off: `docker compose run --rm migrate` before starting a new API image.
  migrate:
    image: ${MIGRATE_IMAGE}
    profiles: ["migrate"]
    restart: "no"
    env_file: api.env
    mem_limit: 256m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
