name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infrastructure/vm/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: mourly
  REGION: us-east1
  ZONE: us-east1-b
  VM_NAME: mourly-api
  IMAGE: us-east1-docker.pkg.dev/mourly/mourly/mourly-api
  WORKLOAD_IDENTITY_PROVIDER: projects/283610054835/locations/global/workloadIdentityPools/github/providers/mourly-repo
  SERVICE_ACCOUNT: github-deployer@mourly.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}:migrate-${{ github.sha }}
          cache-from: type=gha

      - name: Upload stack files to the VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --tunnel-through-iap --quiet \
            --command="mkdir -p ~/release-${{ github.sha }}"
          gcloud compute scp --zone=${{ env.ZONE }} --tunnel-through-iap --quiet \
            infrastructure/vm/docker-compose.yml infrastructure/vm/Caddyfile infrastructure/vm/deploy.sh \
            ${{ env.VM_NAME }}:~/release-${{ github.sha }}/

      - name: Deploy on the VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} --zone=${{ env.ZONE }} --tunnel-through-iap --quiet \
            --command="sudo bash ~/release-${{ github.sha }}/deploy.sh \
              ${{ env.IMAGE }}:${{ github.sha }} \
              ${{ env.IMAGE }}:migrate-${{ github.sha }} \
              \$HOME/release-${{ github.sha }}"

      - name: Check the public health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS https://api.mourly.com/health; then exit 0; fi
            sleep 5
          done
          exit 1
